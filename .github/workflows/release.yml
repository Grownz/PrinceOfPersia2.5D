name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Package (exe + README only, never game data)
        run: pwsh tools/package.ps1
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/PrinceOfPersia-x64.zip --title "${{ github.ref_name }}" --notes-file CHANGELOG.md --verify-tag
