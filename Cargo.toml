[workspace]
resolver = "2"
members = ["crates/pop-core", "crates/pop-app"]

# Bevy is slow unoptimized; keep our own crates debuggable.
[profile.dev.package."*"]
opt-level = 3
[profile.dev]
opt-level = 1

# Release: thin LTO keeps link times reasonable; default codegen-units (parallel) for build speed.
[profile.release]
opt-level = 3
lto = "thin"
strip = true
