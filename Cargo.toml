[workspace]
resolver = "2"
members = ["crates/pop-core", "crates/pop-app"]

# Bevy is slow unoptimized; keep our own crates debuggable.
[profile.dev.package."*"]
opt-level = 3
# dependencies keep file and line (backtraces, profilers) but no variable info: they are optimised (opt-level 3) anyway. Measured on a cold
# `cargo build -p pop-app`: target/debug 8.65 -> 4.6 GB, the pdb 1090 -> 402 MB, 334 -> 254 s; the relink after a change did not clearly shorten
debug = "line-tables-only"
[profile.dev]
opt-level = 1

# Release: fat LTO and one codegen unit (smallest, fastest exe; the link is slow: about 8 minutes on a fast machine). Measure
# before changing (POP_BENCH, POP_PERF): thin LTO would link faster.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
