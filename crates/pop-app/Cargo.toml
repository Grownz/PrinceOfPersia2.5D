[package]
name = "pop-app"
version = "0.6.11"
license = "MIT"
edition = "2021"

[dependencies]
bevy = { version = "0.20", default-features = false, features = ["std","async_executor","multi_threaded","bevy_window","bevy_winit","bevy_render","bevy_core_pipeline","bevy_pbr","bevy_post_process","bevy_anti_alias","bevy_light","bevy_camera","bevy_mesh","bevy_image","bevy_asset","bevy_color","bevy_sprite","bevy_sprite_render","bevy_ui","bevy_ui_render","bevy_text","system_font_discovery","default_font","bevy_audio","bevy_gilrs","bevy_state","bevy_log","png","hdr","tonemapping_luts","smaa_luts","zstd_rust"] }
oplon = "1.0.0"
pop-core = { path = "../pop-core" }
rustysynth = "1.3.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# R3 trial: Bevy Solari ray-traced lighting for render_mode = rt_experimental (needs an RT GPU; never default).
# No `dlss` feature: bevy/dlss needs the NVIDIA DLSS SDK (DLSS_SDK), the Vulkan SDK and libclang to build (docs/r3_solari.md).
solari = ["bevy/bevy_solari"]
